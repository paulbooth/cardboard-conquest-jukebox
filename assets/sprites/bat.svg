<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Bat: wings mid-flap, big ears, tiny fangs — one tenth of a weather event -->
  <!-- left wing: scalloped membrane -->
  <path d="M28 30 Q18 16 4 14 Q10 22 8 28 Q14 26 16 32 Q21 30 24 36 Z"
        fill="#cfcfcf" stroke="#242424" stroke-width="2" stroke-linejoin="round"/>
  <path d="M24 26 Q16 20 8 19 M22 30 Q15 26 10 26" fill="none" stroke="#8a8a8a" stroke-width="1.1"/>
  <!-- right wing -->
  <path d="M36 30 Q46 16 60 14 Q54 22 56 28 Q50 26 48 32 Q43 30 40 36 Z"
        fill="#cfcfcf" stroke="#242424" stroke-width="2" stroke-linejoin="round"/>
  <path d="M40 26 Q48 20 56 19 M42 30 Q49 26 54 26" fill="none" stroke="#8a8a8a" stroke-width="1.1"/>
  <!-- furry body -->
  <ellipse cx="32" cy="36" rx="7.4" ry="9" fill="#dcdcdc" stroke="#242424" stroke-width="2"/>
  <!-- head with big radar ears -->
  <circle cx="32" cy="24" r="6.4" fill="#dcdcdc" stroke="#242424" stroke-width="2"/>
  <path d="M27 20 L24 10 L30 16 Z" fill="#cfcfcf" stroke="#242424" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M37 20 L40 10 L34 16 Z" fill="#cfcfcf" stroke="#242424" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- squinty eyes + fangs -->
  <circle cx="29.6" cy="23" r="1.3" fill="#242424"/>
  <circle cx="34.4" cy="23" r="1.3" fill="#242424"/>
  <path d="M30 28 L30.6 30.4 M34 28 L33.4 30.4" stroke="#ededed" stroke-width="1.6" stroke-linecap="round"/>
  <!-- little feet tucked up -->
  <path d="M29 45 L28 48 M35 45 L36 48" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
  <!-- echolocation ticks -->
  <path d="M46 40 Q49 42 49 46 M50 37 Q54 40 54 45" fill="none" stroke="#b8b8b8" stroke-width="1.4" stroke-linecap="round"/>
</svg>
