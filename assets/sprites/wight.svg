<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Wight: a barrow-king — tarnished crown, corroded plate, cold straight sword -->
  <!-- legs -->
  <rect x="25" y="46" width="6" height="11" rx="2" fill="#8a8a8a"/>
  <rect x="34" y="46" width="6" height="11" rx="2" fill="#8a8a8a"/>
  <!-- corroded plate, pitted -->
  <path d="M22 26 Q22 21 32 21 Q42 21 42 26 L43 48 L21 48 Z" fill="#cfcfcf" stroke="#242424" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="27" cy="32" r="1.2" fill="#8a8a8a"/>
  <circle cx="36" cy="38" r="1.4" fill="#8a8a8a"/>
  <circle cx="30" cy="43" r="1.1" fill="#8a8a8a"/>
  <!-- burial wrap sash -->
  <path d="M22 30 L42 40" stroke="#ececec" stroke-width="3" opacity="0.85"/>
  <!-- gaunt crowned head, cold eyes -->
  <circle cx="32" cy="13" r="6" fill="#dcdcdc" stroke="#242424" stroke-width="2"/>
  <path d="M26 9 L26 4 L29 7.4 L32 3 L35 7.4 L38 4 L38 9 Z" fill="#b8b8b8" stroke="#242424" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M28.4 13.6 L31 13.6 M33.6 13.6 L36.2 13.6" stroke="#242424" stroke-width="1.8" stroke-linecap="round"/>
  <!-- long straight barrow-blade held point-down -->
  <path d="M42 30 L50 32" stroke="#b8b8b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M50.4 26 L53.6 26 L53 54 L51 54 Z" fill="#ededed" stroke="#242424" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M47 30 L57 30" stroke="#9a9a9a" stroke-width="2.4" stroke-linecap="round"/>
  <!-- grave-cold wisps at the boots -->
  <path d="M20 56 Q16 55 15 52 M44 56 Q48 55 49 52" fill="none" stroke="#dcdcdc" stroke-width="1.6" stroke-linecap="round"/>
</svg>
