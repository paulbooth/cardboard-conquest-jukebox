<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Acid Slime: a hissing blob mid-drip, bubbles bursting off a corroding skin -->
  <!-- main body, sagging and drippy -->
  <path d="M10 42 Q10 22 32 22 Q54 22 54 42 Q54 47 48 47 Q46 44 44 48 Q41 52 38 47 Q36 43 33 48 Q30 53 27 47 Q25 43 22 48 Q19 52 16 47 Q10 47 10 42 Z"
        fill="#cfcfcf" stroke="#242424" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- corrosion pits -->
  <circle cx="22" cy="32" r="2.2" fill="#9a9a9a"/>
  <circle cx="42" cy="36" r="1.8" fill="#9a9a9a"/>
  <circle cx="34" cy="28" r="1.4" fill="#9a9a9a"/>
  <!-- narrowed caustic eyes -->
  <path d="M24 36 L30 37.6 M44 33 L38 35" stroke="#242424" stroke-width="2.4" stroke-linecap="round"/>
  <!-- rising acid bubbles, one bursting -->
  <circle cx="18" cy="16" r="2.6" fill="none" stroke="#b8b8b8" stroke-width="1.6"/>
  <circle cx="30" cy="12" r="2" fill="none" stroke="#b8b8b8" stroke-width="1.5"/>
  <circle cx="44" cy="15" r="2.8" fill="none" stroke="#b8b8b8" stroke-width="1.6"/>
  <path d="M49 10 L51 8 M51.6 12 L54 11.4 M48 13.6 L46.6 15.6" stroke="#b8b8b8" stroke-width="1.4" stroke-linecap="round"/>
  <!-- sizzling puddle drips -->
  <ellipse cx="20" cy="55" rx="4.6" ry="1.6" fill="#b8b8b8"/>
  <ellipse cx="38" cy="56" rx="6" ry="1.8" fill="#b8b8b8"/>
</svg>
