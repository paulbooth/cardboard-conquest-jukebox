<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Banshee: wailing spirit — thrown-back head, streaming hair, sound rings -->
  <!-- streaming hair sweeping back -->
  <path d="M28 12 Q14 8 6 14 Q14 15 18 19 Q10 20 6 26 Q14 25 19 27 Q13 30 12 36 Q20 32 24 30 Z"
        fill="#b8b8b8" stroke="#242424" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- body trailing to wisps -->
  <path d="M22 26 Q22 14 33 14 Q43 15 43 26 L44 40 Q41 37 39 43 Q36 48 33 43 Q30 38 27 44 Q24 48 22 41 Z"
        fill="#d6d6d6" fill-opacity="0.92" stroke="#242424" stroke-width="2" stroke-linejoin="round"/>
  <!-- head thrown back mid-wail -->
  <circle cx="34" cy="15" r="6.4" fill="#ececec" stroke="#242424" stroke-width="2"/>
  <path d="M31 13 Q32 11.6 33.4 12.4 M36.6 12.4 Q38 11.6 39 13" fill="none" stroke="#242424" stroke-width="1.2" stroke-linecap="round"/>
  <ellipse cx="35.6" cy="18.6" rx="2.2" ry="3" fill="#242424"/>
  <!-- clawed hands raised to the temples -->
  <path d="M25 28 Q22 22 26 18 M44 28 Q47 22 43 18" fill="none" stroke="#c8c8c8" stroke-width="3.2" stroke-linecap="round"/>
  <!-- the wail: expanding rings -->
  <path d="M46 12 Q50 15 50 20 M50 8 Q56 12 56 20 M54 4 Q62 9 62 20" fill="none" stroke="#dcdcdc" stroke-width="2" stroke-linecap="round"/>
</svg>
