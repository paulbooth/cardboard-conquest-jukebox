<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Skulker: a low, creeping knife-man, blade held back and low for a slipped-in cut -->
  <ellipse cx="32" cy="57" rx="13" ry="3" fill="#000000" opacity="0.16"/>
  <!-- hunched, low-slung body -->
  <path d="M18 44 Q22 34 32 35 Q44 36 46 44 L44 52 L34 49 L24 52 Z" fill="#454f5c" stroke="#1c2128" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- forward-craned hood + head -->
  <path d="M40 38 Q52 33 52 42 Q49 46 42 45 Q40 42 40 38 Z" fill="#39434f" stroke="#1c2128" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="48" cy="41" r="1.3" fill="#c8d6e0"/>
  <!-- trailing knife hand, blade held low and back -->
  <path d="M20 44 L10 50" stroke="#2b333d" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M11 49 L3 53 L10 47 Z" fill="#d7e2ea" stroke="#1c2128" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
