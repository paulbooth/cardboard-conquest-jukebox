<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Cutthroat: a hooded knife-man crouched to lunge, dagger raised for the opening strike -->
  <ellipse cx="32" cy="58" rx="12" ry="3" fill="#000000" opacity="0.16"/>
  <!-- crouched cloak body -->
  <path d="M20 34 Q20 28 30 28 Q40 28 41 34 L45 55 L36 51 L31 56 L26 51 L16 55 Z" fill="#3f4a58" stroke="#1c2128" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- drawn hood, face in shadow -->
  <path d="M22 30 Q24 16 34 18 Q42 20 40 30 Q34 31 28 31 Q24 31 22 30 Z" fill="#333d49" stroke="#1c2128" stroke-width="2" stroke-linejoin="round"/>
  <!-- cold eyes -->
  <circle cx="30" cy="25" r="1.5" fill="#c8d6e0"/>
  <circle cx="35" cy="25.5" r="1.3" fill="#c8d6e0"/>
  <!-- raised knife arm -->
  <path d="M40 33 L50 22" stroke="#2b333d" stroke-width="4" stroke-linecap="round"/>
  <!-- dagger blade + crossguard -->
  <path d="M50 23 L56 9 L53 22 Z" fill="#d7e2ea" stroke="#1c2128" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="47" y1="24" x2="53" y2="21" stroke="#1c2128" stroke-width="2"/>
</svg>
